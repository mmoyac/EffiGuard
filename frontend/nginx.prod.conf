server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ── Por que el upstream es effiguard_backend y no backend ───────────
    # Este contenedor esta conectado a `internal` y a `general-net`, y esta
    # ultima es una red compartida con las demas apps del VPS. El nombre de
    # servicio `backend` es generico: si otra app de `general-net` tiene un
    # servicio con ese mismo nombre, el DNS de Docker resuelve de forma
    # ambigua y nginx puede terminar hablandole al backend equivocado.
    #
    # Paso en produccion: tras un `up --force-recreate` cambio el orden de
    # conexion a las redes, `/docs` empezo a servir el Swagger de otra app y
    # el login devolvia 404 porque esa API no tiene /api/v1/auth/login. El
    # backend de EffiGuard estaba sano; simplemente no le llegaba nada.
    #
    # `effiguard_backend` es el container_name declarado en el compose, unico
    # en todo el host, asi que la resolucion no puede colisionar.

    # FastAPI docs (acceso desde internet)
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://effiguard_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Proxy API calls to backend service
    location /api/v1 {
        proxy_pass http://effiguard_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Íconos PWA derivados del logo del tenant. Llevan el hash del logo en el
    # nombre, así que un logo distinto produce una URL distinta: cachearlos
    # para siempre es seguro y evita revalidar en cada carga.
    location ^~ /static/pwa-icons/ {
        proxy_pass http://effiguard_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Archivos estáticos del backend (logos de tenants, etc.)
    # ^~ evita que el bloque regex de assets tome prioridad sobre este proxy
    location ^~ /static {
        proxy_pass http://effiguard_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Nunca cachear los archivos que deciden qué versión corre ─────────
    # index.html referencia los bundles con hash y sw.js contiene el manifiesto
    # de precache. Si el navegador los sirve de su caché HTTP, el usuario queda
    # clavado en la versión vieja hasta hacer Ctrl+Shift+R.
    # Las location exacta (=) ganan sobre cualquier regex, así que estos bloques
    # no los pisa el de assets de más abajo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA fallback
    # El try_files hacia /index.html hace un redirect interno que vuelve a
    # matchear locations, así que las rutas profundas también salen con no-cache.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sólo los assets con hash en el nombre son inmutables: su contenido no
    # cambia nunca, cada build genera nombres nuevos.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # El runtime de workbox queda en la raíz, no en /assets/, pero también
    # lleva hash en el nombre.
    location ~* ^/workbox-[^/]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
