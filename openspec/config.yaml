schema: spec-driven

context: |
  # EffiGuard

  SaaS multi-tenant de gestión de activos, control de bodega y prevención de robos.
  Uso industrial: fábricas y obras. Operado con guantes desde teléfonos y tablets.
  Aún NO está en producción con usuarios reales.

  ## Stack

  - Backend: FastAPI (Python 3.11), SQLAlchemy 2.0 async, asyncpg, PostgreSQL, Alembic.
  - Frontend: React 18 + Vite + TypeScript, Tailwind CSS, React Query, Zustand, Lucide React.
  - Infra: Docker Compose (postgres, backend, frontend). PWA con vite-plugin-pwa.
  - Integraciones: n8n (webhook de chat + consultas vía API key).

  ## Arquitectura backend

  - Capas: `api/v1/` (routers) → `services/` (reglas de negocio) → `repositories/` (persistencia) → `models/`.
  - `BaseRepository[T]` recibe `tenant_id` e inyecta el filtro multi-tenant en TODA query.
    Nunca escribir queries de negocio que omitan `tenant_id`.
  - Dependencias reutilizables en `core/dependencies.py`: `CurrentToken`, `DBSession`, `ApiKeyTenant`.
    Las de Super Admin viven en `core/superadmin.py`: `SuperAdminToken`, `ActingTenantId`.
  - Schemas Pydantic v2 en `schemas/`. Los muy simples se declaran inline en el router.
  - Migraciones Alembic numeradas (`001_…`, `002_…`) en `backend/alembic/versions/`.
    Todo cambio de modelo requiere su migración.

  ## Modelo de catálogo

  El catálogo tiene tres niveles y cada uno responde una pregunta distinta:

  - `productos` — el bien conceptual ("Tornillo autoperforante"). Agrupa; NO tiene stock ni precio.
  - `variantes` — el SKU ("6x40 zincado"). **La** posición de stock, precio y código de barras.
  - `unidades` — el ejemplar físico. Sólo para familias prestables; es lo que se presta.

  Reglas que se violan con facilidad:

  - Un mismo material comprado a varios proveedores es UNA variante con varios códigos,
    no varias variantes. El criterio: ¿el que lo va a usar nota la diferencia?
  - El stock de una variante prestable NO se almacena: es el conteo de sus unidades
    disponibles. Sólo los consumibles usan `variantes.stock_actual`.
  - `codigos` es una sola tabla para todo lo escaneable, con `UNIQUE (tenant_id, codigo)`.
    El `tipo` decide de qué nivel cuelga: `fabricante`/`proveedor`/`empaque` de la variante,
    `serie_fabrica` de la unidad, `propio` de cualquiera.
  - El `factor` de un código de empaque dice cuántas unidades trae esa caja. Vive en el
    código porque la caja de un proveedor trae 100 y la del otro 250.
  - El stock NUNCA se escribe directo: se mueve por compra, ajuste, merma, entrega,
    pérdida o reintegro, y cada movimiento queda en `inventory_logs`.
  - El costo se congela en cada movimiento. Cambiar un precio no revaloriza el pasado.

  ## Convenciones de dominio

  - El dominio se nombra en español (`nombre`, `estado_id`, `fecha_entrega`, `bodeguero_id`).
    Mantener ese idioma en modelos, campos y mensajes de error al usuario.
  - IDs estables usados por la lógica: estados 1 Disponible, 2 En Terreno, 3 En Reparación, 4 Robado.
    Roles: 1 super_admin, 2 admin, 3 bodeguero, 4 operario.
  - El comportamiento (prestable vs consumible) viene de la familia del PRODUCTO
    (`asset_families.comportamiento`), y lo heredan sus variantes y unidades.
    Ningún nivel declara su tipo por su cuenta.
  - La carga masiva por Excel es para el arranque; el día a día se opera desde la interfaz.

  ## Reglas de UI (obligatorias)

  - Modo oscuro forzado. Botones táctiles de mínimo 48px de alto.
  - Mobile-first desde 320px. Sin scroll horizontal en ninguna vista.
    Tablas → tarjetas en móvil; `overflow-x-auto` sólo como último recurso.
  - El menú lateral NO se hardcodea: se construye desde `GET /api/v1/menu` según el rol.

  ## Despliegue

  - Un subdominio por tenant: `https://effiguard-{slug}.effi4tech.cl`, con SSL wildcard `*.effi4tech.cl`.
  - El slug del subdominio resuelve el tenant en el login.
